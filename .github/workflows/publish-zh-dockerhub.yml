name: Publish Chinese build to Docker Hub
on:
  workflow_dispatch:
  push:
    branches: [mikrodash-zh-publish]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the completed build
        uses: actions/download-artifact@v4
        with:
          name: mikrodash-zh-v0.8.82-amd64
          run-id: 43792065580
          github-token: ${{ github.token }}
      - name: Load image
        run: docker load -i mikrodash-zh-v0.8.82-amd64.tar.gz
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -eu
          image="${DOCKERHUB_USERNAME,,}/mikrodash-zh"
          docker tag mikrodash-zh:v0.8.82 "$image:v0.8.82"
          docker tag mikrodash-zh:v0.8.82 "$image:latest"
          docker push "$image:v0.8.82"
          docker push "$image:latest"
